<title>むげん数独</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#EDEFF4; --panel:#FFFFFF; --panel-2:#F5F7FB;
    --ink:#151821; --ink-soft:#5C6478; --line:#D3D8E3;
    --key:#C6CCD9; --key-ink:#151821; --key-alt:#DCE1EB;
    --accent:#2C4B8C; --accent-fg:#FFFFFF;
    --gold:#E0A52F; --gold-ink:#2A1D00;
    --ok:#2E7A4F; --bad:#C4453A;
    --given:#151821; --user:#2C4B8C; --hint-ink:#8A5A00;
    --cell:#FFFFFF; --cell-sel:rgba(44,75,140,.16); --cell-peer:rgba(44,75,140,.07);
    --cell-err:rgba(196,69,58,.18); --cell-ok:rgba(46,122,79,.16);
    --box-line:#151821; --grid-line:#C5CAD6;
    --shadow:0 8px 28px rgba(21,24,33,.16);
    --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101218; --panel:#191D26; --panel-2:#141821;
      --ink:#E7EAF2; --ink-soft:#98A1B6; --line:#2B313E;
      --key:#39404F; --key-ink:#E7EAF2; --key-alt:#262C38;
      --accent:#7EA6EC; --accent-fg:#101218;
      --gold:#D6A03A; --gold-ink:#17130A;
      --ok:#5ECF8A; --bad:#F0786C;
      --given:#E7EAF2; --user:#A8C4F5; --hint-ink:#F0C56A;
      --cell:#191D26; --cell-sel:rgba(126,166,236,.22); --cell-peer:rgba(126,166,236,.09);
      --cell-err:rgba(240,120,108,.22); --cell-ok:rgba(94,207,138,.18);
      --box-line:#E7EAF2; --grid-line:#3A4150;
      --shadow:0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101218; --panel:#191D26; --panel-2:#141821;
    --ink:#E7EAF2; --ink-soft:#98A1B6; --line:#2B313E;
    --key:#39404F; --key-ink:#E7EAF2; --key-alt:#262C38;
    --accent:#7EA6EC; --accent-fg:#101218;
    --gold:#D6A03A; --gold-ink:#17130A;
    --ok:#5ECF8A; --bad:#F0786C;
    --given:#E7EAF2; --user:#A8C4F5; --hint-ink:#F0C56A;
    --cell:#191D26; --cell-sel:rgba(126,166,236,.22); --cell-peer:rgba(126,166,236,.09);
    --cell-err:rgba(240,120,108,.22); --cell-ok:rgba(94,207,138,.18);
    --box-line:#E7EAF2; --grid-line:#3A4150;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(120% 80% at 50% -20%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans); -webkit-text-size-adjust:100%;
    overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
    padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px));
  }
  button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
  a{color:inherit; text-decoration:none}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  #app{
    height:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; gap:8px;
    padding-top:max(8px,env(safe-area-inset-top,0px));
    padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
    overflow:hidden;
  }

  header{display:flex; align-items:center; gap:6px; flex:none}
  .wordmark{
    font-family:var(--serif); font-size:clamp(16px,4.5vw,20px);
    letter-spacing:.04em; margin:0; white-space:nowrap; min-width:0;
  }
  .wordmark em{font-style:normal; color:var(--accent)}
  .spacer{flex:1}
  .icon-btn{
    flex:none; width:36px; height:36px; display:grid; place-items:center; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); padding:0;
  }
  .icon-btn svg{width:17px; height:17px; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .icon-btn[aria-pressed="false"]{opacity:.45}

  .modes{
    display:flex; gap:2px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:11px; padding:2px; flex:none;
  }
  .modes button{
    border:0; background:transparent; color:var(--ink-soft); font-size:12px; font-weight:700;
    padding:6px 9px; border-radius:9px; letter-spacing:.02em; white-space:nowrap; line-height:1;
  }
  .modes button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg)}

  .bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:12.5px; color:var(--ink-soft); font-weight:500; flex:none;
  }
  .bar .chip{
    display:inline-flex; align-items:center; gap:4px;
    border:1px solid var(--line); background:var(--panel); border-radius:999px;
    padding:5px 10px; font-weight:700; font-size:12.5px; color:var(--ink); min-height:32px;
  }
  .bar .chip.active{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--panel))}
  .timer{
    margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700;
    font-size:14px; color:var(--ink); letter-spacing:.04em;
  }
  .timer small{color:var(--ink-soft); font-weight:500; margin-right:4px; font-size:11px; letter-spacing:.08em}

  .board-wrap{
    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    container-type:size;
  }
  .board{
    /* Fit inside the flex leftover — never spill over the difficulty bar */
    width:min(100cqw, 100cqh, calc(100vw - 40px), 420px);
    aspect-ratio:1;
    height:auto;
    max-width:100%; max-height:100%;
    display:grid; grid-template-columns:repeat(9, 1fr); grid-template-rows:repeat(9, 1fr);
    background:var(--cell); border:2.5px solid var(--box-line); gap:0;
    border-radius:8px; box-shadow:var(--shadow); user-select:none; overflow:hidden;
  }
  .board .c{
    position:relative; background:var(--cell); display:grid; place-items:center;
    font-weight:700; font-size:clamp(12px, 5.1cqmin, 22px); line-height:1;
    color:var(--user); cursor:pointer; min-width:0; min-height:0;
    border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
  }
  .board .c:nth-child(9n){border-right:0}
  .board .c:nth-child(n+73){border-bottom:0}
  .board .c:nth-child(3n):not(:nth-child(9n)){border-right:2px solid var(--box-line)}
  .board .c:nth-child(n+19):nth-child(-n+27),
  .board .c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--box-line)}
  .board .c.given{color:var(--given); font-weight:700; cursor:default}
  .board .c.hinted{color:var(--hint-ink)}
  .board .c.peer{background:var(--cell-peer)}
  .board .c.sel{background:var(--cell-sel); outline:2px solid var(--accent); outline-offset:-2px; z-index:1}
  .board .c.same{background:color-mix(in srgb, var(--gold) 22%, var(--cell))}
  .board .c.same.sel{background:var(--cell-sel)}
  .board .c.err{background:var(--cell-err)}
  .board .c.ok{background:var(--cell-ok)}
  .board .c.win{animation:pop .35s ease}

  .notes{
    position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    pointer-events:none; font-size:clamp(7px, 2.2cqmin, 11px); font-weight:500; color:var(--ink-soft); line-height:1;
  }
  .notes span{display:grid; place-items:center}

  #toast{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px;
    font-size:13px; font-weight:700; box-shadow:var(--shadow); z-index:5; white-space:nowrap;
    pointer-events:none;
  }
  #toast.ok{background:var(--ok); color:#fff}
  #toast.bad{background:var(--bad); color:#fff}

  .msg{
    flex:none; min-height:1.4em; text-align:center; font-size:13.5px; font-weight:700;
    color:var(--ink-soft);
  }
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

  .pad{
    flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  }
  .pad button{
    border:0; border-radius:10px; background:var(--key); color:var(--key-ink);
    font-weight:700; font-size:clamp(16px,4.5vw,20px); height:44px;
    display:grid; place-items:center;
  }
  .pad button:active{transform:translateY(1px)}
  .pad button.wide{grid-column:span 2; font-size:13px; background:var(--key-alt); letter-spacing:.04em}
  .pad button.gold{background:var(--gold); color:var(--gold-ink)}

  .actions{
    flex:none; display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .actions .row2{grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .btn{
    border:1px solid var(--line); background:var(--panel); border-radius:12px;
    min-height:46px; font-weight:700; font-size:14px; padding:10px 8px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent}
  .btn.gold{background:var(--gold); color:var(--gold-ink); border-color:transparent}
  .btn:disabled{opacity:.45}

  .win{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(8,10,15,.45); z-index:8; border-radius:8px; padding:16px;
  }
  .win-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px 18px; text-align:center; box-shadow:var(--shadow); max-width:300px; width:100%;
  }
  .win-card h2{font-family:var(--serif); font-size:22px; margin:0 0 8px; letter-spacing:.06em}
  .win-card p{margin:0 0 6px; font-size:14px; color:var(--ink-soft)}
  .win-card .time{font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent); margin:8px 0 14px}
  .win-card .best{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px}
  .win-card .btns{display:flex; flex-direction:column; gap:8px}

  .scrim{position:fixed; inset:0; background:rgba(8,10,15,.5); display:grid; place-items:center; padding:16px; z-index:20}
  .panel{
    background:var(--panel); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:390px;
    max-height:82vh; overflow-y:auto; padding:18px; border:1px solid var(--line);
  }
  .panel h2{font-family:var(--serif); font-size:17px; margin:0 0 12px; letter-spacing:.04em}
  .panel h3{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 8px}
  .panel p, .panel li{font-size:13.5px; line-height:1.75; margin:0 0 8px}
  .panel ul{padding-left:1.1em; margin:0 0 8px}
  .close{float:right; border:0; background:transparent; font-size:20px; line-height:1; color:var(--ink-soft); padding:0 2px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; margin-bottom:8px}
  .stats b{display:block; font-size:20px; font-variant-numeric:tabular-nums; font-weight:700; line-height:1.2}
  .stats span{font-size:10.5px; color:var(--ink-soft)}
  .switch{display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:12px; margin-top:6px}
  .switch p{margin:0; font-size:13px}
  .switch small{display:block; color:var(--ink-soft); font-size:11.5px; line-height:1.5}
  .toggle{width:46px; height:27px; border-radius:99px; border:0; background:var(--key); position:relative; flex:none; transition:background .15s}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle[aria-pressed="true"]{background:var(--accent)}
  .toggle[aria-pressed="true"]::after{transform:translateX(19px)}
  .ghost{width:100%; margin-top:14px; border:1px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px; font-size:13px; font-weight:700}

  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){
    .board .c.win,.toggle,.toggle::after{animation:none!important; transition:none}
  }
  @media (max-height:700px){
    .pad button{height:40px}
    .btn{min-height:42px; font-size:13px}
  }
</style>

<div id="app">
  <header>
    <h1 class="wordmark"><a href="/">むげん<em>数独</em></a></h1>
    <div class="spacer"></div>
    <div class="modes" role="group" aria-label="入力モード">
      <button id="mode-play" type="button" aria-pressed="true">記入</button>
      <button id="mode-note" type="button" aria-pressed="false">メモ</button>
    </div>
    <button class="icon-btn" id="btn-sound" type="button" aria-label="おと" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" type="button" aria-label="テーマ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="btn-help" type="button" aria-label="あそびかた">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.2 2.6c-.5.2-.7.7-.7 1.2v.6"/><path d="M12 17h.01"/></svg>
    </button>
  </header>

  <div class="bar">
    <button class="chip active" type="button" data-diff="easy" id="diff-easy">かんたん</button>
    <button class="chip" type="button" data-diff="normal" id="diff-normal">ふつう</button>
    <button class="chip" type="button" data-diff="hard" id="diff-hard">むずかしい</button>
    <div class="timer"><small>TIME</small><span id="timer">0:00</span></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="数独の盤面"></div>
    <div id="toast" hidden></div>
    <div class="win" id="win" hidden>
      <div class="win-card">
        <h2>クリア！</h2>
        <p id="win-diff">かんたん</p>
        <div class="time" id="win-time">0:00</div>
        <p class="best" id="win-best"></p>
        <div class="btns">
          <button class="btn primary" type="button" id="win-next">つぎの問題</button>
          <button class="btn" type="button" id="win-close">とじる</button>
        </div>
      </div>
    </div>
  </div>

  <p class="msg" id="msg" aria-live="polite"></p>

  <div class="pad" id="pad">
    <button type="button" data-n="1">1</button>
    <button type="button" data-n="2">2</button>
    <button type="button" data-n="3">3</button>
    <button type="button" data-n="4">4</button>
    <button type="button" data-n="5">5</button>
    <button type="button" data-n="6">6</button>
    <button type="button" data-n="7">7</button>
    <button type="button" data-n="8">8</button>
    <button type="button" data-n="9">9</button>
    <button type="button" class="wide" data-act="erase">けす</button>
  </div>

  <div class="actions">
    <button class="btn" type="button" id="btn-check">チェック</button>
    <button class="btn gold" type="button" id="btn-hint">ヒント</button>
    <div class="row2">
      <button class="btn" type="button" id="btn-reset">はじめから</button>
      <button class="btn primary" type="button" id="btn-next">つぎの問題</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "mf-sudoku-v1";
  var DIFF = {
    easy:   { label: "かんたん",   clues: 40 },
    normal: { label: "ふつう",     clues: 32 },
    hard:   { label: "むずかしい", clues: 26 }
  };

  var store = {
    difficulty: "easy",
    theme: null, // null = system, "light" | "dark"
    sound: true,
    best: { easy: null, normal: null, hard: null }
  };

  function loadStore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var got = JSON.parse(raw);
      if (!got || typeof got !== "object") return;
      if (DIFF[got.difficulty]) store.difficulty = got.difficulty;
      if (got.theme === "light" || got.theme === "dark" || got.theme === null) store.theme = got.theme;
      if (typeof got.sound === "boolean") store.sound = got.sound;
      if (got.best) {
        ["easy", "normal", "hard"].forEach(function (d) {
          if (typeof got.best[d] === "number") store.best[d] = got.best[d];
        });
      }
    } catch (e) {}
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  /* ---------- theme ---------- */
  function applyTheme() {
    var root = document.documentElement;
    if (store.theme) root.setAttribute("data-theme", store.theme);
    else root.removeAttribute("data-theme");
  }

  /* ---------- audio ---------- */
  var actx = null;
  function sfx(kind) {
    if (!store.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var notes = {
        click: [[620, 0.04]],
        place: [[740, 0.05]],
        erase: [[280, 0.06]],
        ok: [[520, 0.08], [680, 0.1]],
        bad: [[220, 0.1], [170, 0.12]],
        hint: [[480, 0.07], [600, 0.09]],
        win: [[523, 0.1], [659, 0.1], [784, 0.12], [1047, 0.28]]
      }[kind];
      if (!notes) return;
      var t = actx.currentTime;
      notes.forEach(function (pair) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "triangle";
        o.frequency.value = pair[0];
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + pair[1] + 0.06);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + pair[1] + 0.08);
        t += pair[1];
      });
    } catch (e) {}
  }

  /* ---------- sudoku engine ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function emptyGrid() {
    var g = [];
    for (var i = 0; i < 81; i++) g.push(0);
    return g;
  }

  function cloneGrid(g) { return g.slice(); }

  function candidates(g, i) {
    var used = 0;
    var r = (i / 9) | 0, c = i % 9;
    var br = ((r / 3) | 0) * 3, bc = ((c / 3) | 0) * 3;
    var j, v;
    for (j = 0; j < 9; j++) {
      v = g[r * 9 + j]; if (v) used |= 1 << v;
      v = g[j * 9 + c]; if (v) used |= 1 << v;
    }
    for (var rr = 0; rr < 3; rr++)
      for (var cc = 0; cc < 3; cc++) {
        v = g[(br + rr) * 9 + bc + cc];
        if (v) used |= 1 << v;
      }
    var out = [];
    for (v = 1; v <= 9; v++) if (!(used & (1 << v))) out.push(v);
    return out;
  }

  function findEmpty(g) {
    var best = -1, bestN = 10, i, n;
    for (i = 0; i < 81; i++) if (!g[i]) {
      n = candidates(g, i).length;
      if (n === 0) return -2;
      if (n < bestN) { bestN = n; best = i; if (n === 1) break; }
    }
    return best;
  }

  function fillComplete(g) {
    var i = findEmpty(g);
    if (i === -1) return true;
    if (i === -2) return false;
    var opts = shuffle(candidates(g, i));
    for (var k = 0; k < opts.length; k++) {
      g[i] = opts[k];
      if (fillComplete(g)) return true;
      g[i] = 0;
    }
    return false;
  }

  function countSolutions(g, limit) {
    limit = limit || 2;
    var count = 0;
    function dfs() {
      if (count >= limit) return;
      var i = findEmpty(g);
      if (i === -1) { count++; return; }
      if (i === -2) return;
      var opts = candidates(g, i);
      for (var k = 0; k < opts.length; k++) {
        g[i] = opts[k];
        dfs();
        g[i] = 0;
        if (count >= limit) return;
      }
    }
    dfs();
    return count;
  }

  function generatePuzzle(clueTarget) {
    var solution = emptyGrid();
    fillComplete(solution);
    var puzzle = cloneGrid(solution);
    var order = shuffle([]);
    for (var i = 0; i < 81; i++) order.push(i);
    shuffle(order);

    var clues = 81;
    var attempts = 0;
    var maxAttempts = 220;
    // Prefer removing symmetric pairs for nicer look; fall back to singles
    for (var n = 0; n < order.length && clues > clueTarget && attempts < maxAttempts; n++) {
      var a = order[n];
      if (!puzzle[a]) continue;
      var b = 80 - a;
      var savedA = puzzle[a], savedB = puzzle[b];
      puzzle[a] = 0;
      var removed = 1;
      if (a !== b && puzzle[b]) { puzzle[b] = 0; removed = 2; }

      attempts++;
      var sols = countSolutions(cloneGrid(puzzle), 2);
      if (sols === 1 && clues - removed >= clueTarget - 2) {
        clues -= removed;
      } else if (sols === 1 && removed === 2) {
        // try keeping only one removed
        puzzle[b] = savedB;
        sols = countSolutions(cloneGrid(puzzle), 2);
        if (sols === 1) clues -= 1;
        else { puzzle[a] = savedA; puzzle[b] = savedB; }
      } else {
        puzzle[a] = savedA;
        puzzle[b] = savedB;
      }
      if (clues <= clueTarget) break;
    }

    // If still too many clues, dig singles carefully
    if (clues > clueTarget) {
      order = [];
      for (i = 0; i < 81; i++) if (puzzle[i]) order.push(i);
      shuffle(order);
      for (n = 0; n < order.length && clues > clueTarget; n++) {
        a = order[n];
        savedA = puzzle[a];
        puzzle[a] = 0;
        if (countSolutions(cloneGrid(puzzle), 2) === 1) clues--;
        else puzzle[a] = savedA;
      }
    }

    return { puzzle: puzzle, solution: solution };
  }

  /* ---------- game state ---------- */
  var state = {
    puzzle: emptyGrid(),
    solution: emptyGrid(),
    grid: emptyGrid(),
    notes: [], // 81 arrays of bool[10]
    given: [],
    hinted: [],
    selected: -1,
    noteMode: false,
    startedAt: 0,
    elapsed: 0,
    ticking: false,
    timerId: null,
    won: false,
    flash: null // {type:'err'|'ok', cells:[]}
  };

  function blankNotes() {
    var n = [];
    for (var i = 0; i < 81; i++) {
      var a = [];
      for (var v = 0; v <= 9; v++) a.push(false);
      n.push(a);
    }
    return n;
  }

  function formatTime(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function nowElapsed() {
    if (!state.ticking) return state.elapsed;
    return state.elapsed + (Date.now() - state.startedAt);
  }

  function startTimer() {
    if (state.won || state.ticking) return;
    state.startedAt = Date.now();
    state.ticking = true;
  }
  function stopTimer() {
    if (!state.ticking) return;
    state.elapsed += Date.now() - state.startedAt;
    state.ticking = false;
  }
  function tickUI() {
    document.getElementById("timer").textContent = formatTime(nowElapsed());
  }

  function newGame(diff) {
    stopTimer();
    if (DIFF[diff]) store.difficulty = diff;
    saveStore();
    updateDiffChips();

    var target = DIFF[store.difficulty].clues;
    var gen = generatePuzzle(target);
    state.puzzle = gen.puzzle;
    state.solution = gen.solution;
    state.grid = cloneGrid(gen.puzzle);
    state.notes = blankNotes();
    state.given = gen.puzzle.map(function (v) { return v !== 0; });
    state.hinted = [];
    for (var h = 0; h < 81; h++) state.hinted.push(false);
    state.selected = -1;
    state.elapsed = 0;
    state.won = false;
    state.flash = null;
    document.getElementById("win").hidden = true;
    setMsg("");
    // select first empty
    for (var i = 0; i < 81; i++) if (!state.given[i]) { state.selected = i; break; }
    render();
    tickUI();
  }

  function resetSame() {
    stopTimer();
    state.grid = cloneGrid(state.puzzle);
    state.notes = blankNotes();
    state.hinted = [];
    for (var h = 0; h < 81; h++) state.hinted.push(false);
    state.elapsed = 0;
    state.won = false;
    state.flash = null;
    document.getElementById("win").hidden = true;
    setMsg("はじめからやりなおし");
    sfx("erase");
    render();
    tickUI();
  }

  /* ---------- interaction ---------- */
  function setMsg(text, kind) {
    var el = document.getElementById("msg");
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }

  var toastTimer = null;
  function toast(text, kind) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.className = kind || "";
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 1600);
  }

  function selectCell(i) {
    if (i < 0 || i > 80) return;
    state.selected = i;
    state.flash = null;
    sfx("click");
    render();
  }

  function placeNumber(n) {
    if (state.won) return;
    var i = state.selected;
    if (i < 0 || state.given[i]) {
      toast("このマスはかえられません");
      return;
    }
    startTimer();
    state.flash = null;

    if (state.noteMode) {
      if (state.grid[i]) { state.grid[i] = 0; state.hinted[i] = false; }
      state.notes[i][n] = !state.notes[i][n];
      sfx("place");
      render();
      return;
    }

    if (state.grid[i] === n) {
      state.grid[i] = 0;
      state.hinted[i] = false;
      sfx("erase");
    } else {
      state.grid[i] = n;
      state.hinted[i] = false;
      for (var v = 1; v <= 9; v++) state.notes[i][v] = false;
      // clear notes of n in peers
      clearPeerNotes(i, n);
      sfx("place");
    }
    render();
    checkWin();
  }

  function clearPeerNotes(i, n) {
    var r = (i / 9) | 0, c = i % 9;
    var br = ((r / 3) | 0) * 3, bc = ((c / 3) | 0) * 3;
    var j;
    for (j = 0; j < 9; j++) {
      state.notes[r * 9 + j][n] = false;
      state.notes[j * 9 + c][n] = false;
    }
    for (var rr = 0; rr < 3; rr++)
      for (var cc = 0; cc < 3; cc++)
        state.notes[(br + rr) * 9 + bc + cc][n] = false;
  }

  function eraseCell() {
    if (state.won) return;
    var i = state.selected;
    if (i < 0 || state.given[i]) return;
    startTimer();
    state.grid[i] = 0;
    state.hinted[i] = false;
    for (var v = 1; v <= 9; v++) state.notes[i][v] = false;
    state.flash = null;
    sfx("erase");
    render();
  }

  function doCheck() {
    if (state.won) return;
    var wrong = [], empty = 0;
    for (var i = 0; i < 81; i++) {
      if (!state.grid[i]) { empty++; continue; }
      if (state.grid[i] !== state.solution[i]) wrong.push(i);
    }
    if (wrong.length) {
      state.flash = { type: "err", cells: wrong };
      setMsg("まちがっているマスが " + wrong.length + " こあります", "bad");
      toast("まちがいあり", "bad");
      sfx("bad");
    } else if (empty) {
      state.flash = { type: "ok", cells: [] };
      for (i = 0; i < 81; i++) if (state.grid[i]) state.flash.cells.push(i);
      setMsg("ここまではせいかい！ あと " + empty + " マス", "ok");
      toast("ここまではOK", "ok");
      sfx("ok");
    } else {
      checkWin();
      return;
    }
    render();
    setTimeout(function () {
      if (state.flash) { state.flash = null; render(); }
    }, 1400);
  }

  function doHint() {
    if (state.won) return;
    startTimer();
    var empties = [];
    for (var i = 0; i < 81; i++) {
      if (!state.given[i] && state.grid[i] !== state.solution[i]) empties.push(i);
    }
    if (!empties.length) { toast("もう埋めています"); return; }
    var pick = empties[(Math.random() * empties.length) | 0];
    state.grid[pick] = state.solution[pick];
    state.hinted[pick] = true;
    for (var v = 1; v <= 9; v++) state.notes[pick][v] = false;
    clearPeerNotes(pick, state.solution[pick]);
    state.selected = pick;
    state.flash = { type: "ok", cells: [pick] };
    setMsg("ヒント：1マスうめました");
    sfx("hint");
    render();
    checkWin();
    setTimeout(function () {
      if (state.flash) { state.flash = null; render(); }
    }, 900);
  }

  function checkWin() {
    for (var i = 0; i < 81; i++) {
      if (state.grid[i] !== state.solution[i]) return;
    }
    stopTimer();
    state.won = true;
    var ms = state.elapsed;
    var d = store.difficulty;
    var isBest = store.best[d] == null || ms < store.best[d];
    if (isBest) { store.best[d] = ms; saveStore(); }
    sfx("win");
    document.getElementById("win-diff").textContent = DIFF[d].label;
    document.getElementById("win-time").textContent = formatTime(ms);
    var bestEl = document.getElementById("win-best");
    if (isBest) bestEl.textContent = "新記録！";
    else bestEl.textContent = "ベスト " + formatTime(store.best[d]);
    document.getElementById("win").hidden = false;
    setMsg("クリア！", "ok");
    render();
  }

  /* ---------- render ---------- */
  function updateDiffChips() {
    ["easy", "normal", "hard"].forEach(function (d) {
      var btn = document.getElementById("diff-" + d);
      if (btn) btn.classList.toggle("active", store.difficulty === d);
    });
  }

  function render() {
    var board = document.getElementById("board");
    board.innerHTML = "";
    var sel = state.selected;
    var selVal = sel >= 0 ? state.grid[sel] : 0;
    var sr = sel >= 0 ? (sel / 9) | 0 : -1;
    var sc = sel >= 0 ? sel % 9 : -1;
    var sbr = sr >= 0 ? (sr / 3) | 0 : -1;
    var sbc = sc >= 0 ? (sc / 3) | 0 : -1;

    for (var i = 0; i < 81; i++) {
      var r = (i / 9) | 0, c = i % 9;
      var cell = document.createElement("div");
      cell.className = "c";
      cell.setAttribute("role", "gridcell");
      cell.dataset.i = String(i);
      var isPeer = sel >= 0 && (r === sr || c === sc || (((r / 3) | 0) === sbr && ((c / 3) | 0) === sbc));
      if (isPeer) cell.classList.add("peer");
      if (i === sel) cell.classList.add("sel");
      if (selVal && state.grid[i] === selVal) cell.classList.add("same");
      if (state.given[i]) cell.classList.add("given");
      else if (state.hinted[i]) cell.classList.add("hinted");
      if (state.flash && state.flash.cells.indexOf(i) >= 0) {
        cell.classList.add(state.flash.type === "err" ? "err" : "ok");
      }
      if (state.won) cell.classList.add("win");

      var v = state.grid[i];
      if (v) {
        cell.textContent = String(v);
        // mark wrong filled cells lightly when same as selection? skip
      } else {
        var hasNote = false;
        var notes = document.createElement("div");
        notes.className = "notes";
        for (var n = 1; n <= 9; n++) {
          var sp = document.createElement("span");
          if (state.notes[i][n]) { sp.textContent = String(n); hasNote = true; }
          notes.appendChild(sp);
        }
        if (hasNote) cell.appendChild(notes);
      }

      board.appendChild(cell);
    }

    document.getElementById("mode-play").setAttribute("aria-pressed", String(!state.noteMode));
    document.getElementById("mode-note").setAttribute("aria-pressed", String(state.noteMode));
    document.getElementById("btn-sound").setAttribute("aria-pressed", String(store.sound));
    document.getElementById("btn-sound").style.opacity = store.sound ? "1" : ".45";
  }

  /* ---------- panels ---------- */
  function openPanel(build) {
    closePanel();
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.id = "scrim";
    var panel = document.createElement("div");
    panel.className = "panel";
    var close = document.createElement("button");
    close.type = "button"; close.className = "close"; close.setAttribute("aria-label", "とじる");
    close.textContent = "×";
    close.addEventListener("click", closePanel);
    panel.appendChild(close);
    build(panel);
    scrim.appendChild(panel);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) closePanel(); });
    document.body.appendChild(scrim);
  }
  function closePanel() {
    var s = document.getElementById("scrim");
    if (s) s.remove();
  }

  function showHelp() {
    openPanel(function (panel) {
      var h = document.createElement("h2");
      h.textContent = "あそびかた";
      panel.appendChild(h);
      var ul = document.createElement("ul");
      [
        "マスをタップして、下の数字パッドで 1〜9 を入れる。",
        "「メモ」モードでは候補の数字を小さく書ける。",
        "かんたん / ふつう / むずかしい でヒント（最初から埋まっているマス）の数がかわる。",
        "「チェック」でまちがいを確認。「ヒント」で1マス正解が埋まる。",
        "「はじめから」は同じ問題をやりなおし。「つぎの問題」は新しい盤面。"
      ].forEach(function (t) {
        var li = document.createElement("li"); li.textContent = t; ul.appendChild(li);
      });
      panel.appendChild(ul);

      var h3 = document.createElement("h3"); h3.textContent = "ベストタイム"; panel.appendChild(h3);
      var stats = document.createElement("div"); stats.className = "stats";
      ["easy", "normal", "hard"].forEach(function (d) {
        var cell = document.createElement("div");
        var b = document.createElement("b");
        b.textContent = store.best[d] == null ? "—" : formatTime(store.best[d]);
        var s = document.createElement("span"); s.textContent = DIFF[d].label;
        cell.appendChild(b); cell.appendChild(s); stats.appendChild(cell);
      });
      panel.appendChild(stats);

      var sw = document.createElement("div"); sw.className = "switch";
      var txt = document.createElement("p");
      txt.textContent = "ダークモード";
      var small = document.createElement("small");
      small.textContent = "オフにすると明るいテーマ固定";
      txt.appendChild(small);
      var tg = document.createElement("button");
      tg.type = "button"; tg.className = "toggle";
      var darkOn = store.theme === "dark" || (!store.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      // Toggle means: force dark vs force light (cycle with header button too)
      tg.setAttribute("aria-pressed", String(store.theme === "dark" || (store.theme === null && darkOn)));
      tg.addEventListener("click", function () {
        var preferDark = matchMedia("(prefers-color-scheme: dark)").matches;
        if (store.theme === "dark") store.theme = "light";
        else if (store.theme === "light") store.theme = preferDark ? null : "dark";
        else store.theme = preferDark ? "light" : "dark";
        applyTheme();
        saveStore();
        tg.setAttribute("aria-pressed", String(store.theme === "dark" || (store.theme === null && matchMedia("(prefers-color-scheme: dark)").matches)));
      });
      sw.appendChild(txt); sw.appendChild(tg);
      panel.appendChild(sw);
    });
  }

  /* ---------- wiring ---------- */
  document.getElementById("board").addEventListener("click", function (e) {
    var t = e.target.closest(".c");
    if (!t) return;
    selectCell(+t.dataset.i);
  });

  document.getElementById("pad").addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.act === "erase") eraseCell();
    else if (t.dataset.n) placeNumber(+t.dataset.n);
  });

  document.getElementById("mode-play").addEventListener("click", function () {
    state.noteMode = false; render();
  });
  document.getElementById("mode-note").addEventListener("click", function () {
    state.noteMode = true; render();
  });

  ["easy", "normal", "hard"].forEach(function (d) {
    document.getElementById("diff-" + d).addEventListener("click", function () {
      if (store.difficulty === d && !state.won) {
        // same difficulty: still allow regenerating via つぎの問題
        return;
      }
      newGame(d);
      sfx("click");
    });
  });

  document.getElementById("btn-check").addEventListener("click", doCheck);
  document.getElementById("btn-hint").addEventListener("click", doHint);
  document.getElementById("btn-reset").addEventListener("click", resetSame);
  document.getElementById("btn-next").addEventListener("click", function () {
    newGame(store.difficulty); sfx("click");
  });
  document.getElementById("win-next").addEventListener("click", function () {
    newGame(store.difficulty); sfx("click");
  });
  document.getElementById("win-close").addEventListener("click", function () {
    document.getElementById("win").hidden = true;
  });

  document.getElementById("btn-sound").addEventListener("click", function () {
    store.sound = !store.sound; saveStore(); render(); sfx("click");
  });
  document.getElementById("btn-theme").addEventListener("click", function () {
    if (store.theme === "dark") store.theme = "light";
    else if (store.theme === "light") store.theme = "dark";
    else store.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    applyTheme(); saveStore(); sfx("click");
  });
  document.getElementById("btn-help").addEventListener("click", showHelp);

  document.addEventListener("keydown", function (e) {
    if (document.getElementById("scrim")) {
      if (e.key === "Escape") closePanel();
      return;
    }
    if (e.key >= "1" && e.key <= "9") { placeNumber(+e.key); e.preventDefault(); }
    else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") { eraseCell(); e.preventDefault(); }
    else if (e.key === "n" || e.key === "N" || e.key === "m" || e.key === "M") {
      state.noteMode = !state.noteMode; render();
    } else if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
      var i = state.selected < 0 ? 0 : state.selected;
      var r = (i / 9) | 0, c = i % 9;
      if (e.key === "ArrowLeft") c = (c + 8) % 9;
      if (e.key === "ArrowRight") c = (c + 1) % 9;
      if (e.key === "ArrowUp") r = (r + 8) % 9;
      if (e.key === "ArrowDown") r = (r + 1) % 9;
      selectCell(r * 9 + c);
      e.preventDefault();
    }
  });

  /* ---------- boot ---------- */
  loadStore();
  applyTheme();
  updateDiffChips();
  newGame(store.difficulty);
  setInterval(tickUI, 250);
})();
</script>
