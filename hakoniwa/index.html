<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f2e">
<meta name="description" content="ドット絵でつくる、スマホで遊べるまちづくりシミュレーション。">
<title>ハコニワ市長</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: full-screen pixel map; game HUD pinned top, mobile-game tool dock pinned bottom, SFC-style blue windows */
:root{
  --ink:#0b0f2e; --win-a:#2d3fa6; --win-b:#18225e; --rim:#eef0ff; --gold:#f8d848;
  --txt:#ffffff; --sub:#aeb8f2; --bad:#ff6a58; --good:#5ee07a;
  --R:#4fd05a; --C:#4f8ff8; --I:#f2c62c;
  --font:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.35}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--ink)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--font);color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.win{background:linear-gradient(180deg,var(--win-a),var(--win-b));border:2px solid var(--rim);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px #5a6ad6,0 4px 0 2px rgba(0,0,0,.35);border-radius:6px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:8px max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
#hud .win{pointer-events:auto}
.row{display:flex;gap:6px;align-items:stretch;min-width:0}
#cityBar{flex:1;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;min-width:0;gap:8px}
#cityName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#cls{display:inline-block;background:var(--gold);color:var(--ink);padding:0 6px;border-radius:3px;margin-left:6px;font-size:12px;vertical-align:1px}
#date{white-space:nowrap;color:var(--sub)}
.stat{padding:3px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat small{font-size:10px;color:var(--sub);letter-spacing:.08em}
.stat b{font-weight:normal;font-size:15px;white-space:nowrap}
#fundsBox{flex:1.2}#popBox{flex:1}
#fundsBox b.neg{color:var(--bad)}
#rci{display:flex;gap:3px;align-items:flex-end;padding:3px 6px}
#rci canvas{width:42px;height:38px;display:block}
#speed{display:flex;padding:3px;gap:2px}
#speed button{width:30px;height:32px;border:0;background:transparent;border-radius:4px;padding:0;display:grid;place-items:center}
#speed button img{width:20px;height:20px}
#speed button.on{background:var(--gold)}
#speed button.on img{filter:brightness(0) saturate(100%) invert(6%) sepia(50%) saturate(3000%) hue-rotate(225deg)}

/* goals */
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;text-align:left;min-height:34px}
.pill .tag{flex:none;background:var(--good);color:var(--ink);border-radius:3px;padding:0 5px;font-size:10px}
.pill .tag.gold{background:var(--gold)}
.pill .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pr{flex:none;color:var(--gold)}
.pill.done{animation:flash .9s steps(6) 2}
@keyframes flash{50%{background:var(--gold);color:var(--ink)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.modes button{min-height:50px;border:2px solid var(--rim);border-radius:6px;background:#222e86;font-size:13px;line-height:1.25;padding:4px 6px;text-align:left}
.modes button small{display:block;color:var(--sub);font-size:11px}
.modes button.on{background:var(--gold);color:var(--ink)}
.modes button.on small{color:#3a3010}
.stars{color:var(--gold);letter-spacing:1px}
.mlist{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.mlist div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 8px;border-radius:4px;background:#0b0f2e66}
.mlist .d{color:var(--sub);text-decoration:line-through}
.mlist .c{background:rgba(94,224,122,.2);box-shadow:inset 0 0 0 1px var(--good)}
@media (prefers-reduced-motion:reduce){.pill.done{animation:none}}
#rankBtn{flex:none;border:0;background:#0b0f2e88;border-radius:4px;padding:2px 6px;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:72px}
#rankBtn .lv{font-size:11px;color:var(--gold);white-space:nowrap}#rankBtn .lv b{font-weight:normal;font-size:13px;margin-left:2px}
#rankBtn .xp{display:block;height:4px;background:#0b0f2e;border:1px solid #5a68c8;border-radius:2px;overflow:hidden}#rankBtn .xp u{display:block;height:100%;width:0;background:var(--good)}
#rankBtn.up{animation:flash .9s steps(6) 2}
#cityName{min-width:0;flex:1}
#questPill{flex:1.25}
.card.lock img{filter:grayscale(1) brightness(.55)}
.card .lk{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:11px;background:#0b0f2ecc;color:var(--gold);padding:1px 0}
.perks{display:grid;gap:8px;margin-top:8px}
.perk{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border:2px solid var(--rim);border-radius:6px;background:linear-gradient(#3a4cc0,#222e86);min-height:56px}
.perk:active{transform:translateY(2px)}
.perk .pi{flex:none;width:40px;height:40px;display:grid;place-items:center;background:#0b0f2e;border-radius:4px;font-size:20px;color:var(--gold)}
.perk b{display:block;font-weight:normal;color:var(--gold);font-size:15px}
.perk span{font-size:12px}
#questList{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,360px);overflow-y:auto;margin:6px 0;padding-right:2px}
.qi{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--rim);border-radius:6px;background:#222e86;padding:6px 8px;min-height:52px}
.qi .no{flex:none;width:30px;height:30px;display:grid;place-items:center;background:#0b0f2e;border-radius:4px;color:var(--gold);font-size:14px}
.qi .tx{flex:1;min-width:0}.qi .tx b{display:block;font-weight:normal;font-size:14px}.qi .tx small{display:block;color:var(--sub);font-size:11px;line-height:1.3}
.qi .st{flex:none;color:var(--gold);font-size:12px}
.qi.lock{opacity:.45}
/* side buttons */
#side{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:140px;display:flex;flex-direction:column;gap:8px;z-index:5}
.sbtn{width:46px;height:46px;padding:0;display:grid;place-items:center;position:relative}
.sbtn img{width:28px;height:28px}
.sbtn span{position:absolute;bottom:-1px;left:0;right:0;font-size:9px;text-align:center;color:var(--sub);letter-spacing:.05em}
.sbtn.on{border-color:var(--gold)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;border:1px solid #fff}

/* advisor */
#adv{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:142px;right:64px;max-width:380px;display:flex;gap:8px;align-items:flex-start;padding:8px;z-index:6;transition:transform .25s steps(5),opacity .25s;transform:translateY(-8px);opacity:0;pointer-events:none}
#adv.show{transform:none;opacity:1;pointer-events:auto}
#adv canvas{width:48px;height:48px;flex:none;background:#8cc8f8;border:2px solid var(--rim);border-radius:4px}
#adv .who{font-size:11px;color:var(--gold)}
#adv .say{font-size:13px}

/* dock */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:6px;padding:0 max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));pointer-events:none}
#dock>*{pointer-events:auto}
#hint{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;min-height:44px;box-sizing:border-box}
#hint .t{flex:1;min-width:0;font-size:12px;line-height:1.3}
#hint .c{color:var(--gold)}
#hintX{border:0;background:#0006;border-radius:5px;width:38px;height:38px;padding:0;display:grid;place-items:center;flex:none}
#hintX img{width:16px;height:16px}
#okBtn{flex:none;height:38px;padding:0 12px;font-size:14px;display:flex;align-items:center;gap:6px;border:2px solid #e8ffe8;border-radius:6px;background:linear-gradient(#3fbf52,#1e7a32);white-space:nowrap}
#okBtn img{width:16px;height:16px}
#anchorBtn{flex:none;height:38px;padding:0 10px;font-size:13px;border:2px solid var(--rim);border-radius:6px;background:linear-gradient(#ffe070,#d8a020);color:var(--ink);white-space:nowrap}
#pad{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--dockH,96px) + 8px);display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px;z-index:5}
#pad button{padding:0;font-size:16px;display:grid;place-items:center;touch-action:none}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
#okBtn.dis{filter:grayscale(1);opacity:.7}
#tray{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
#tray::-webkit-scrollbar{display:none}
.card{flex:none;width:78px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:start;position:relative}
.card img{width:48px;height:48px}
.card .n{font-size:11px;white-space:nowrap}
.card .p{font-size:11px;color:var(--gold)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--gold),0 4px 0 2px rgba(0,0,0,.35)}
.card.no{opacity:.45}
.card .cnt{position:absolute;top:2px;right:4px;font-size:10px;color:var(--gold)}
#tray .empty{padding:14px 12px;font-size:12px;color:var(--sub);white-space:normal;max-width:300px}
#cats{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px}
.cat{border:0;background:transparent;border-radius:5px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cat img{width:30px;height:30px}
.cat span{font-size:10px;color:var(--sub);white-space:nowrap}
.cat.on{background:rgba(248,216,72,.18);box-shadow:inset 0 0 0 2px var(--gold)}
.cat.on span{color:var(--gold)}
#undoBox{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(var(--dockH,96px) + 8px);display:flex;flex-direction:column;gap:8px;z-index:5}
#undoBox .sbtn img{width:24px;height:24px;margin-bottom:8px}

/* info card */
#info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH,96px) + 8px);width:min(360px,calc(100% - 120px));padding:8px 10px;z-index:6}
#info h4{margin:0 0 4px;font-weight:normal;color:var(--gold);font-size:14px}
#info .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px}
#info .kv span:nth-child(odd){color:var(--sub)}

/* modal */
#modalWrap{position:absolute;inset:0;background:rgba(5,8,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
#modal{width:min(420px,100%);max-height:calc(100% - 20px);overflow:auto;padding:14px 14px 12px}
#modal h3{margin:0 0 10px;font-weight:normal;font-size:18px;color:var(--gold);text-wrap:balance}
#modal p{margin:6px 0;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bt{flex:1;min-width:120px;min-height:44px;padding:6px 12px;font-size:15px;border:2px solid var(--rim);border-radius:6px;background:linear-gradient(#3a4cc0,#222e86);box-shadow:0 3px 0 var(--ink)}
.bt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bt.gold{background:linear-gradient(#ffe070,#d8a020);color:var(--ink);border-color:#fff6c8}
.bt.red{background:linear-gradient(#e85a4a,#a02a20)}
.bt.sm{min-width:0;flex:none;min-height:36px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:4px 2px;border-bottom:1px dashed #5a68c8}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sum td{border-bottom:0;color:var(--gold);font-size:15px}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0}
.ctl label{flex:1;font-size:13px}
.ctl .v{width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}
.ctl button{width:36px;height:36px;border:2px solid var(--rim);border-radius:6px;background:#222e86;font-size:18px;padding:0}
.bar{height:10px;background:#0b0f2e;border-radius:2px;overflow:hidden;border:1px solid #5a68c8}
.bar i{display:block;height:100%;background:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #5a68c8;font-size:14px}
.toggle button{min-width:64px;height:32px;border:2px solid var(--rim);border-radius:16px;background:#222e86;font-size:13px}
.toggle button.on{background:var(--gold);color:var(--ink)}
#mini{width:100%;max-width:288px;display:block;margin:6px auto;border:2px solid var(--rim);border-radius:4px;touch-action:none}
.lay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lay button{min-height:40px;border:2px solid var(--rim);border-radius:6px;background:#222e86;font-size:12px;padding:2px}
.lay button.on{background:var(--gold);color:var(--ink)}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
.legend .ramp{flex:1;height:8px;margin:4px 8px;border-radius:2px}
input[type=text]{font-family:var(--font);font-size:16px;width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid var(--rim);border-radius:6px;background:#0b0f2e;color:#fff}

/* title */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;background:linear-gradient(rgba(10,14,46,.25),rgba(10,14,46,.75))}
#logo{width:min(340px,92%);image-rendering:pixelated}
#title .win{width:min(380px,100%);padding:14px;box-sizing:border-box}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.diff button{min-height:52px;border:2px solid var(--rim);border-radius:6px;background:#222e86;font-size:13px;line-height:1.2}
.diff button small{display:block;color:var(--sub);font-size:11px}
.diff button.on{background:var(--gold);color:var(--ink)}
.diff button.on small{color:#3a3010}
.lbl{font-size:12px;color:var(--sub);margin:6px 0 4px}
.copy{font-size:11px;color:var(--sub);text-align:center}
@media (prefers-reduced-motion:reduce){#adv{transition:none}}
@media (min-width:760px){#tray{justify-content:center}.card{width:86px}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}</style>
</head>
<body>

<div id="app">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div class="row">
      <div id="cityBar" class="win"><div id="cityName">ハコニワ市<span id="cls">村</span></div><button id="rankBtn" aria-label="市長レベル"><span class="lv">市長Lv<b id="rankN" class="num">1</b></span><i class="xp"><u id="xpBar"></u></i></button><div id="date" class="num">1900年 1月</div></div>
    </div>
    <div class="row">
      <div id="fundsBox" class="win stat"><small>資金</small><b id="funds" class="num">$0</b></div>
      <div id="popBox" class="win stat"><small>人口</small><b id="pop" class="num">0</b></div>
      <div id="rci" class="win" title="需要メーター"><canvas id="rciC" width="42" height="38" class="px"></canvas></div>
      <div id="speed" class="win">
        <button data-sp="0" aria-label="一時停止"><img class="px" data-ic="pause" alt=""></button>
        <button data-sp="1" aria-label="ふつう"><img class="px" data-ic="play1" alt=""></button>
        <button data-sp="2" aria-label="はやい"><img class="px" data-ic="play2" alt=""></button>
        <button data-sp="3" aria-label="とてもはやい"><img class="px" data-ic="play3" alt=""></button>
      </div>
    </div>
    <div class="row" id="goalRow">
      <button class="win pill" id="reqPill"><span class="tag">お願い</span><span class="mt" id="reqT"></span><span class="pr num" id="reqP"></span></button>
      <button class="win pill" id="bookPill" style="flex:none"><span class="tag gold">図鑑</span><span class="pr num" id="bookT">0/12</span></button>
      <button class="win pill" id="questPill" hidden><span class="tag gold">目標</span><span class="mt" id="questT"></span><span class="pr num" id="questP"></span></button>
    </div>
  </div>

  <div id="side" hidden>
    <button class="win sbtn" id="bMap" aria-label="マップ"><img class="px" data-ic="layers" alt=""><span>マップ</span></button>
    <button class="win sbtn" id="bBudget" aria-label="予算"><img class="px" data-ic="coin" alt=""><span>予算</span></button>
    <button class="win sbtn" id="bEval" aria-label="評価"><img class="px" data-ic="chart" alt=""><span>評価</span></button>
    <button class="win sbtn" id="bMenu" aria-label="メニュー"><img class="px" data-ic="menu" alt=""><span>メニュー</span></button>
  </div>

  <div id="adv" class="win"><canvas id="advC" width="24" height="24" class="px"></canvas><div><div class="who">ひしょ ポッポ</div><div class="say" id="advT"></div></div></div>

  <div id="undoBox"><button class="win sbtn" id="undo1" hidden aria-label="1マス戻す"><img class="px" data-ic="undo" alt=""><span>1マス</span></button><button class="win sbtn" id="undo" hidden aria-label="まとめて戻す"><img class="px" data-ic="undo" alt=""><span>まとめて</span></button></div>
  <div id="info" class="win" hidden></div>
  <div id="pad" hidden><button class="win u" data-d="0,-1" aria-label="上へ1マス">▲</button><button class="win l" data-d="-1,0" aria-label="左へ1マス">◀</button><button class="win r" data-d="1,0" aria-label="右へ1マス">▶</button><button class="win d" data-d="0,1" aria-label="下へ1マス">▼</button></div>

  <div id="dock" hidden>
    <div id="hint" class="win" hidden><span class="t" id="hintT"></span><button id="anchorBtn" hidden>範囲で</button><button id="okBtn" hidden><img class="px" data-ic="check" alt=""><span id="okT">建てる</span></button><button id="hintX" aria-label="やめる"><img class="px" data-ic="close" alt=""></button></div>
    <div class="win" id="trayWin" hidden><div id="tray"></div></div>
    <div class="win"><div id="cats"></div></div>
  </div>

  <div id="modalWrap" hidden><div id="modal" class="win" role="dialog" aria-modal="true"></div></div>

  <div id="title" hidden>
    <canvas id="logo" width="170" height="64" class="px"></canvas>
    <div class="win">
      <div id="contWrap"></div>
      <div class="lbl">あそびかた</div>
      <div class="modes" id="modeSel"></div>
      <div id="questList" hidden></div>
      <div id="freeOpts">
      <div class="lbl">まちの名前</div>
      <input id="nameIn" type="text" maxlength="10" value="ハコニワ市">
      <div class="lbl" id="diffLbl">むずかしさ</div>
      <div class="diff" id="diffSel">
        <button data-d="0" class="on">やさしい<small>$20,000</small></button>
        <button data-d="1">ふつう<small>$10,000</small></button>
        <button data-d="2">むずかしい<small>$5,000</small></button>
      </div>
      <div class="btns" style="margin-top:6px">
        <button class="bt sm" id="reroll">地形をかえる</button>
        <button class="bt gold" id="startBtn">市長になる</button>
      </div>
      </div>
    </div>
    <div class="copy">地図を動かして十字に合わせて建てる ・ 2本指でズーム</div>
  </div>
</div>

<script>
(()=>{
'use strict';
const T=16,W=96,H=80,N=W*H,CS=4,CW=W/CS,CH=H/CS;
const ROAD=1,RAIL=2,PWR=4;

    for(let a=-1;a<=1;a++){const qx=Math.round(px+(dy?a*.6:0)),qy=Math.round(py+(dx?a*.6:0));if(qx>=0&&qy>=0&&qx<W&&qy<H)t[qy*W+qx]=1}

    const i=y*W+x;if(c[i]===1&&n<=1)t[i]=0;else if(c[i]===0&&n>=3)t[i]=1}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(t[i]===0&&t1(x,y)*.7+t2(x,y)*.3>.6)t[i]=2}
}

    for(let y=p.y;y<p.y+d.s;y++)for(let x=p.x;x<p.x+d.s;x++){const i=y*W+x;seen[i]=1;q.push(i)}
    while(qi<q.length){const i=q[qi++];order.push(i);const x=i%W,y=(i/W)|0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const j=Y*W+X;if(seen[j])continue;if((S.net[j]&PWR)||S.bid[j]){seen[j]=1;q.push(j)}}}

function recalcTraffic(){

function demand(){
  let Rp=0,Cp=0,Ip=0,z=0;for(const k in S.bld){const b=S.bld[k];if(!DEFS[b.type].zone)continue;z++;const p=ZPOP[b.type][b.lvl];if(b.type==='R')Rp+=p;else if(b.type==='C')Cp+=p;else Ip+=p}
  S.Rp=Rp;S.Cp=Cp;S.Ip=Ip;S.zones=z;S.pop=Rp+Cp+Ip;
  const tR=(Cp*(S.rule&&S.rule.noI?3.2:1)+Ip)*1.25+400,tC=Rp*.32,tI=Rp*.4+300+(cnt('expo')?Rp*.08:0);
  const v=(t,c)=>(t-c)/Math.max(c,500);const tx=(7-S.tax)*.055;
  if(S.rule&&S.rule.noI){}
  const nk=PK('ninki')?.1:0;
  let r=clamp(v(tR,Rp)*.8+tx+nk,-1,1),c=clamp(v(tC,Cp)*.8+tx+nk-(Rp<300?.4:0),-1,1),i=clamp(v(tI,Ip)*.8+tx+nk,-1,1);

function updateZones(){
  let noPow=0,noRoad=0,jam=0;
  for(const k in S.bld){const b=S.bld[k];const d=DEFS[b.type];if(!d.zone)continue;
    const cx=((b.x+1)/CS)|0,cy=((b.y+1)/CS)|0,ci=cy*CW+cx;const lvv=pmap.lv[ci],po=pmap.poll[ci],cr=pmap.crime[ci];
    const old=b.lvl,oc=b.cls;b.cls=lvv<70?0:lvv<145?1:2;
    if(!b.pw){noPow++;if(b.lvl>0&&rnd()<.3)b.lvl--}
    else{
      const cs=b.comps||[];let trip=false;
      for(const c of cs){const inf=compInfo[c];if(b.type==='R'&&(inf.C||inf.I))trip=true;if(b.type==='C'&&inf.R)trip=true;if(b.type==='I'&&(inf.R||inf.edge))trip=true}
      if(!cs.length||!trip){noRoad++;if(b.lvl>0&&rnd()<.2)b.lvl--}
      else{
        let cg=0;for(const i of b.per)cg+=traffic[i];cg=b.per.length?cg/b.per.length/255:0;if(cg>.62)jam++;
        let sc;const cong=Math.max(0,cg-.55)*1.6;
        if(b.type==='R')sc=S.valR*.7+(lvv-80)/260-po/170-cr/260-cong;
        else if(b.type==='C')sc=S.valC*.7+(lvv-60)/300-cr/320-cong;
        else sc=S.valI*.7+.08-cong*.6;
        sc+=(rnd()-.5)*.35;if(b.happy>0){b.happy--;sc+=.25}if(PK('grow'))sc+=.08;if(b.cb&&b.cb.some(x=>COMBO[x].grow))sc+=.12;
        const maxL=b.type==='I'?6:Math.min(6,(lvv<55?3:lvv<95?4:lvv<150?5:6)+(PK('dense')?1:0));
        if(sc>.12&&b.lvl<maxL&&rnd()<.42)b.lvl++;else if(((sc<-.3&&rnd()<.38)||(b.lvl>maxL&&!(b.happy>0)&&rnd()<.13))&&b.lvl>0)b.lvl--;
      }
    }
    if(b.lvl!==old||(b.cls!==oc&&b.lvl>0))markRect(b.x,b.y,3,3);
  }
  S.noPow=noPow;S.noRoad=noRoad;S.jam=jam;
}

function destroyBuilding(b,rubble){const s=DEFS[b.type].s;for(let y=b.y;y<b.y+s;y++)for(let x=b.x;x<b.x+s;x++){const i=y*W+x;S.bid[i]=0;S.fire[i]=0;if(rubble)S.rub[i]=1;S.terr[i]=S.terr[i]===2?0:S.terr[i]}delete S.bld[b.id];markRect(b.x,b.y,s,s);netChanged=true}
function wreck(i){const id=S.bid[i];if(id&&S.bld[id]){destroyBuilding(S.bld[id],true);return}const x=i%W,y=(i/W)|0;if(S.terr[i]===1)return;if(S.net[i]||S.terr[i]===2){S.net[i]=0;S.terr[i]=0;S.rub[i]=1;markTile(x,y,1);netChanged=true}}
function fireTick(){
  for(let i=0;i<N;i++){if(!S.fire[i])continue;const x=i%W,y=(i/W)|0;
    const cov=pmap.fir[cellOf(x,y)]/255;
    if(rnd()<.03+cov*.35+(PK('safety')?.08:0)){S.fire[i]=0;continue}
    if(rnd()<.14){const d=[[1,0],[-1,0],[0,1],[0,-1]][rnd()*4|0];const X=x+d[0],Y=y+d[1];if(inb(X,Y)){const j=Y*W+X;if(S.bid[j]!==S.bid[i]||!S.bid[i])ignite(j)}}
    S.fire[i]--;if(!S.fire[i])wreck(i);
  }
  if(tornado){tornado.life--;tornado.a+=(rnd()-.5)*.8;tornado.x=clamp(tornado.x+Math.cos(tornado.a)*.8,1,W-2);tornado.y=clamp(tornado.y+Math.sin(tornado.a)*.8,1,H-2);
    const i=(tornado.y|0)*W+(tornado.x|0);wreck(i);if(rnd()<.3)wreck(i+1);if(tornado.life<=0)tornado=null}
  for(let i=0;i<N;i++)if(S.flood[i]){S.flood[i]--;if(S.flood[i]>20&&rnd()<.12){const x=i%W,y=(i/W)|0;const d=[[1,0],[-1,0],[0,1],[0,-1]][rnd()*4|0];const X=x+d[0],Y=y+d[1];if(inb(X,Y)){const j=Y*W+X;if(S.terr[j]!==1&&!S.flood[j]){S.flood[j]=S.flood[i]-4;if(S.bid[j])wreck(j)}}}}
}
function randomTileNear(cx,cy,r){for(let k=0;k<40;k++){const x=Math.round(cx+(rnd()*2-1)*r),y=Math.round(cy+(rnd()*2-1)*r);if(inb(x,y))return y*W+x}return-1}
function disaster(kind){
  const c=S.center||[W/2,H/2];
  if(kind==='fire'){let ok=false;for(let k=0;k<30&&!ok;k++){const i=randomTileNear(c[0],c[1],18);if(i>=0&&S.bid[i])ok=ignite(i)}if(!ok)for(let k=0;k<20;k++){const i=randomTileNear(c[0],c[1],25);if(i>=0&&ignite(i))break}advise('火事です！ 消防署の近くなら早く消えます。',1);focusOn(c)}
  if(kind==='tornado'){tornado={x:c[0]+(rnd()-.5)*30,y:c[1]+(rnd()-.5)*20,a:rnd()*6.28,life:70};advise('竜巻が発生しました！',1);focusOn([tornado.x,tornado.y])}
  if(kind==='quake'){quake=2.2;for(let k=0;k<45;k++){const i=randomTileNear(c[0],c[1],20);if(i<0)continue;if(rnd()<.45)ignite(i);else wreck(i)}advise('地震です！ 建物がこわれました。',1)}
  if(kind==='flood'){let best=-1;for(let k=0;k<300;k++){const i=randomTileNear(c[0],c[1],30);if(i<0||S.terr[i]!==1)continue;const x=i%W,y=(i/W)|0;let land=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(inb(x+dx,y+dy)&&S.terr[(y+dy)*W+x+dx]!==1)land++;if(land){best=i;break}}
    if(best<0){advise('この街には洪水の起きる水辺がありません。');return}const x=best%W,y=(best/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(inb(X,Y)&&S.terr[Y*W+X]!==1)S.flood[Y*W+X]=60}advise('洪水です！ 水が引くまで待ちましょう。',1);focusOn([x,y])}

  netChanged=true;sfx('boom');
}

function monthTick(){
  if(netChanged){recalcPower();recalcTransport();netChanged=false}else recalcPower();
  recalcTraffic();detectCombos(true);recalcMaps();demand();updateZones();recalcPower();
  // road decay when underfunded
  if(S.fund.road<100&&S.roadTiles){const n=Math.floor((100-S.fund.road)/20);for(let k=0;k<n;k++){const i=rnd()*N|0;if(S.net[i]&ROAD&&!(S.net[i]&RAIL)){S.net[i]&=~ROAD;S.rub[i]=1;markTile(i%W,(i/W)|0,1);netChanged=true}}}
  if((S.disasters||(S.rule&&S.rule.disaster))&&S.pop>500){const p=rnd()/((S.rule&&S.rule.disaster)||1)*(PK('safety')?2:1);const fc=pmap.fir.reduce((a,b)=>a+b,0)/(CW*CH);if(p<.012-Math.min(.008,fc/3000))disaster('fire');else if(p<.013&&S.pop>3000)disaster('tornado');else if(p<.0137&&S.pop>8000)disaster('quake');else if(p<.015)disaster('flood');else if(cnt('airport')&&rnd()<.003)disaster('plane');else if(cnt('nuclear')&&rnd()<.0002)disaster('melt')}
  checkClass();checkGifts();adviceTick();
  S.month++;if(S.month>11){S.month=0;S.year++;yearEnd()}
  reqMonthly();
  checkQuest();
}
function budgetCalc(){
  const lvAvg=pmap.lv.reduce((a,b)=>a+b,0)/(CW*CH);
  const tax=Math.round(S.pop*S.tax/100*(.6+lvAvg/250)*1.7*DIFF[S.diff].mul);
  const roadNeed=S.roadTiles+S.railTiles*2,polNeed=(cnt('police')+cnt('polhq'))*100,firNeed=(cnt('fire')+cnt('firehq'))*100;
  const road=Math.round(roadNeed*S.fund.road/100),pol=Math.round(polNeed*S.fund.police/100),fir=Math.round(firNeed*S.fund.fire/100);
  const casino=cnt('casino')*100+(S.combos||[]).reduce((a,c)=>a+(COMBO[c.id].inc||0),0)*(PK('combo2')?2:1)+(PK('grant')?500:0),loan=S.loan>0?1000:0;
  return{tax,road,pol,fir,roadNeed,polNeed,firNeed,casino,loan,total:tax+casino-road-pol-fir-loan};
}
function yearEnd(){
  const b=budgetCalc();S.lastBudget=b;S.lastYear=S.year-1;
  S.popGrowth=S.pop-S.popYearAgo;S.popYearAgo=S.pop;
  if(S.autoBudget){applyBudget(b);advise(`${S.year-1}年の収支は ${b.total>=0?'+':''}$${fmt(b.total)} でした。`)}
  else{S.prevSpeed=speed||1;setSpeed(0,true);openBudget(true)}
  save(true);
}
function applyBudget(b){S.funds+=b.total;if(S.loan>0)S.loan--;if(S.funds<0){S.fund.road=Math.max(0,S.fund.road-30);S.funds=0;advise('資金不足で道路の維持費を削りました。道路が傷んでいきます。',1)}}
function checkClass(){let c=0;for(let k=0;k<CLASSES.length;k++)if(S.pop>=CLASSES[k][0])c=k;if(c>S.cls){S.cls=c;gainXP(25*c);showModal(`<h3>祝！「${CLASSES[c][1]}」になりました</h3><p>人口が ${fmt(CLASSES[c][0])} 人を超えました。市民も市長の手腕をたたえています。</p><div class="btns"><button class="bt gold" data-close>つづける</button></div>`);sfx('fanfare')}else if(c<S.cls)S.cls=c}
function checkGifts(){for(const[k,cond,why]of GIFTS){if(S.giftGiven[k])continue;if(cond()){S.giftGiven[k]=1;S.giftStock[k]=(S.giftStock[k]||0)+1;giftModal(k,why);break}}
  if(S.giftGiven.zoo&&!S.giftGiven.zoo2&&cnt('stadium')>=3){S.giftGiven.zoo2=1;S.giftStock.zoo=(S.giftStock.zoo||0)+1;giftModal('zoo','スタジアムが3つになりました')}

}

  R:{kind:'zone',hint:'ドラッグした範囲に区画をしきつめる'},C:{kind:'zone',hint:'ドラッグした範囲に区画をしきつめる'},I:{kind:'zone',hint:'ドラッグした範囲に区画をしきつめる'},
};
for(const k in DEFS)if(!TOOLS[k])TOOLS[k]={kind:'bld',hint:DEFS[k].gift?DEFS[k].d:'置きたい場所をタップ'};
for(const k of['R','C','I'])Object.assign(TOOLS[k],{name:DEFS[k].name,cost:100});
for(const k in DEFS)if(TOOLS[k].kind==='bld')Object.assign(TOOLS[k],{name:DEFS[k].name,cost:DEFS[k].cost});

function linePath(a,b){const out=[];const[x0,y0]=a,[x1,y1]=b;const hFirst=Math.abs(x1-x0)>=Math.abs(y1-y0);
  if(hFirst){const sx=Math.sign(x1-x0);for(let x=x0;x!==x1;x+=sx)out.push([x,y0]);const sy=Math.sign(y1-y0);for(let y=y0;y!==y1;y+=sy)out.push([x1,y]);out.push([x1,y1])}
  else{const sy=Math.sign(y1-y0);for(let y=y0;y!==y1;y+=sy)out.push([x0,y]);const sx=Math.sign(x1-x0);for(let x=x0;x!==x1;x+=sx)out.push([x,y1]);out.push([x1,y1])}
  return out}
function lineCost(tool,path){const t=TOOLS[tool];let cost=0;const ok=[];
  for(const[x,y]of path){if(!inb(x,y))continue;const i=y*W+x;if(S.bid[i]||S.rad[i]||S.flood[i]){ok.push(false);continue}
    if(t.park){if(S.net[i]||S.terr[i]===1){ok.push(false);continue}ok.push(true);cost+=lc(tool,0);continue}
    if(S.net[i]&t.bit){ok.push(null);continue}ok.push(true);cost+=lc(tool,S.terr[i]===1)}
  return{cost,ok}}
function zoneGrid(a,b){const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]),x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  const nx=Math.max(1,Math.floor((x1-x0+1)/3)),ny=Math.max(1,Math.floor((y1-y0+1)/3));
  const tap=a[0]===b[0]&&a[1]===b[1];const ox=tap?a[0]-1:b[0]<a[0]?a[0]-nx*3+1:a[0],oy=tap?a[1]-1:b[1]<a[1]?a[1]-ny*3+1:a[1];
  const out=[];for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)out.push([ox+i*3,oy+j*3]);return out}
function canPlace(type,x,y){const s=DEFS[type].s;if(x<0||y<0||x+s>W||y+s>H)return false;
  for(let Y=y;Y<y+s;Y++)for(let X=x;X<x+s;X++){const i=Y*W+X;if(S.terr[i]===1||S.bid[i]||S.net[i]||S.rad[i]||S.flood[i])return false}
  if(type==='port'){let w=false;for(let X=x-1;X<=x+s;X++)for(const Y of[y-1,y+s])if(isW(X,Y)&&inb(X,Y))w=true;for(let Y=y;Y<y+s;Y++)for(const X of[x-1,x+s])if(isW(X,Y)&&inb(X,Y))w=true;if(!w)return false}
  return true}
function addBuilding(type,x,y){const s=DEFS[type].s;const id=S.nextId++;const b={id,type,x,y,lvl:0,cls:0,seed:(rnd()*1e6)|0,pw:false};S.bld[id]=b;
  for(let Y=y;Y<y+s;Y++)for(let X=x;X<x+s;X++){const i=Y*W+X;S.bid[i]=id;S.rub[i]=0;if(S.terr[i]===2)S.terr[i]=0}markRect(x,y,s,s);netChanged=true;return b}
let undoStack=[];
function pushUndo(rec){undoStack.push(rec);if(undoStack.length>20)undoStack.shift();refreshUndo()}
function spend(c){if(c>S.funds){advise('資金が足りません。',1);sfx('err');return false}S.funds-=c;return true}
function commitLine(tool,path){const t=TOOLS[tool];const{cost,ok}=lineCost(tool,path);if(!cost)return false;if(!spend(cost))return false;const rec={items:[]};
  path.forEach(([x,y],k)=>{if(ok[k]!==true)return;const i=y*W+x;
    if(t.park){const b=addBuilding('park',x,y);rec.items.push(['b',b.id,lc(tool,0)])}else{const c=lc(tool,S.terr[i]===1);S.net[i]|=t.bit;if(S.terr[i]===2)S.terr[i]=0;S.rub[i]=0;rec.items.push(['n',i,t.bit,c]);markTile(x,y,1)}});
  pushUndo(rec);netChanged=true;sfx('place');quickRecalc();return true}
function commitZones(type,list){const good=list.filter(([x,y])=>canPlace(type,x,y));const cost=good.length*costOf(type);if(!good.length){sfx('err');return false}if(!spend(cost))return false;const rec={items:[]};
  for(const[x,y]of good){const b=addBuilding(type,x,y);rec.items.push(['b',b.id,costOf(type)])}
  if(DEFS[type].gift){S.giftStock[type]--;rec.gift=type}
  pushUndo(rec);sfx('place');quickRecalc();return true}
function revertItem(it){if(it[0]==='n'){if(S.net[it[1]]&it[2]){S.net[it[1]]&=~it[2];markTile(it[1]%W,(it[1]/W)|0,1);S.funds+=it[3]}}else{const b=S.bld[it[1]];if(b){destroyBuilding(b,false);S.funds+=it[2]}}}
function doUndo(one){const rec=undoStack[undoStack.length-1];if(!rec)return;
  if(one&&rec.items.length>1){revertItem(rec.items.pop())}
  else{undoStack.pop();for(let k=rec.items.length-1;k>=0;k--)revertItem(rec.items[k]);if(rec.gift){S.giftStock[rec.gift]=(S.giftStock[rec.gift]||0)+1;buildTray();updateGiftBadge()}}
  netChanged=true;refreshUndo();quickRecalc();sfx('undo')}
function bulldozeInfo(a,b){const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]),x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);let cost=0;const kill=new Set();const tiles=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!inb(x,y))continue;const i=y*W+x;if(S.bid[i]){if(!kill.has(S.bid[i])){kill.add(S.bid[i]);cost+=DEFS[S.bld[S.bid[i]].type].s**2}}else if(S.net[i]||S.terr[i]===2||S.rub[i]){tiles.push(i);cost++}}
  return{cost,kill,tiles,x0,y0,x1,y1}}
function bulldozeRect(a,b){const{cost,kill,tiles,x0,y0,x1,y1}=bulldozeInfo(a,b);
  if(!cost)return false;if(!spend(cost))return false;
  for(const id of kill){const bb=S.bld[id];if(bb)destroyBuilding(bb,false)}
  for(const i of tiles){S.net[i]=0;if(S.terr[i]===2)S.terr[i]=0;S.rub[i]=0;S.fire[i]=0;markTile(i%W,(i/W)|0,1)}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y)){S.rub[y*W+x]=0;S.fire[y*W+x]=0;markTile(x,y,1)}
  netChanged=true;sfx('boom');quickRecalc();return true}

function clampCam(){const z=cam.z,ww=W*T,wh=H*T,vw=VW/z,vh=VH/z;const m=80/z;

  const rx=(typeof retS!=='undefined'&&retS[0])||VW/2,ry=(typeof retS!=='undefined'&&retS[1])||VH/2;
  const lx=Math.min(-m,T/2-rx/z,(ww-vw)/2),hx=Math.max(ww-vw+m,ww-T/2-rx/z,(ww-vw)/2);
  const ly=Math.min(-m*1.6,T/2-ry/z,(wh-vh)/2),hy=Math.max(wh-vh+m*2.2,wh-T/2-ry/z,(wh-vh)/2);

function unb64(s,Ctor){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Ctor(u.buffer)}
function serialize(){const o={};for(const k in S){const v=S[k];if(v instanceof Uint8Array)o[k]={u8:b64(v)};else if(v instanceof Int32Array)o[k]={i32:b64(v)};else o[k]=v}
  o.bld={};for(const id in S.bld){const b=S.bld[id];o.bld[id]={id:b.id,type:b.type,x:b.x,y:b.y,lvl:b.lvl,cls:b.cls,seed:b.seed}}return JSON.stringify(o)}
function deserialize(str){const o=JSON.parse(str);for(const k in o){const v=o[k];if(v&&v.u8)o[k]=unb64(v.u8,Uint8Array);else if(v&&v.i32)o[k]=unb64(v.i32,Int32Array)}return o}

function detectCombos(announce){if(!S||!S.bld)return;const B=Object.values(S.bld);for(const b of B)b.cb=null;const inst=[];
  for(const d of COMBOS){const used=new Set();
    for(const a of B){if(!d.anchor.includes(a.type)||used.has(a.id))continue;if(d.water&&!nearWater(a))continue;const ac=bc(a);
      const pool=B.filter(o=>!used.has(o.id)&&Math.hypot(bc(o)[0]-ac[0],bc(o)[1]-ac[1])<=d.r).sort((x,y)=>Math.hypot(bc(x)[0]-ac[0],bc(x)[1]-ac[1])-Math.hypot(bc(y)[0]-ac[0],bc(y)[1]-ac[1]));
      if(d.no){let bad=false;for(const t in d.no)if(B.some(o=>o.type===t&&Math.hypot(bc(o)[0]-ac[0],bc(o)[1]-ac[1])<=d.no[t]))bad=true;if(bad)continue}
      const mem=[a];let ok=true;
      for(const t in d.need){let need=d.need[t];const match=o=>t==='plant'?(o.type==='coal'||o.type==='nuclear'):o.type===t;if(match(a))need--;
        for(const o of pool){if(need<=0)break;if(o===a||mem.includes(o)||!match(o))continue;mem.push(o);need--}if(need>0){ok=false;break}}
      if(!ok)continue;if(d.rail&&!mem.some(o=>o.rail))continue;
      mem.forEach(o=>used.add(o.id));let cx=0,cy=0;mem.forEach(o=>{const q=bc(o);cx+=q[0];cy+=q[1];o.cb=(o.cb||[]).concat(d.id)});inst.push({id:d.id,cx:cx/mem.length,cy:cy/mem.length,n:mem.length})}}
  S.combos=inst;
  if(announce&&!comboBoot){S.comboMax=S.comboMax||{};const ct={};inst.forEach(c=>ct[c.id]=(ct[c.id]||0)+1);for(const id in ct){if(ct[id]>(S.comboMax[id]||0)){if(S.comboMax[id])gainXP(10*(ct[id]-S.comboMax[id]));S.comboMax[id]=ct[id]}}}
  if(announce&&!comboBoot)for(const c of inst){if(S.found[c.id])continue;S.found[c.id]=S.year;gainXP(40,[c.cx,c.cy]);const d=COMBO[c.id];

QUESTS.forEach((q,i)=>q.seed=9100+i*37);
function qDone(q){if(q.done)return q.done();const[c,t]=q.prog();return c>=t}
function qLeft(){return Math.max(0,S.qEnd-nowM())}
function updQuestPill(){const q=S.quest&&!S.qDone&&QUESTS.find(x=>x.id===S.quest);$('#questPill').hidden=!q;$('#bookPill').hidden=!!q;if(!q)return;
  const[c,t,dir]=q.prog();const left=qLeft();$('#questT').textContent=dir?`${q.short} ${fmt(c)}→${fmt(t)}`:`${q.short} ${fmt(Math.min(c,t))}/${fmt(t)}`;$('#questP').textContent=`${left/12|0}年${left%12}月`}
function qStars(){const q=QUESTS.find(x=>x.id===S.quest);const f=qLeft()/(q.years*12);return f>=.5?3:f>=.2?2:1}
function checkQuest(){if(!S.quest||S.qDone)return;const q=QUESTS.find(x=>x.id===S.quest);if(!q)return;if(S.qStartPop==null)S.qStartPop=S.pop;
  if(qDone(q)){S.qDone=1;const st=qStars();const pr=qProg();const best=Math.max(st,(pr[q.id]||{}).stars||0);pr[q.id]={stars:best};try{localStorage.setItem(QKEY,JSON.stringify(pr))}catch(e){}
    const idx=QUESTS.indexOf(q),nx=QUESTS[idx+1];setSpeed(0,true);
    showModal(`<h3>クエストクリア！「${q.name}」</h3><p style="font-size:34px;text-align:center;margin:6px 0" class="stars">${starStr(st)}</p><p style="text-align:center">のこり ${qLeft()/12|0}年${qLeft()%12}か月で達成</p><p style="text-align:center;color:var(--sub);font-size:12px">★3：期限の半分以内 ・ ★2：のこり2割以上</p>
     <div class="btns">${nx?`<button class="bt gold" id="qNext">次へ「${nx.name}」</button>`:''}</div><div class="btns" style="margin-top:8px"><button class="bt sm" id="qKeep" style="flex:1">このまま遊ぶ</button><button class="bt sm" id="qList" style="flex:1">クエスト一覧</button></div>`,null,()=>{
     if(nx)$('#qNext').onclick=()=>{closeModal();startQuest(nx)};$('#qKeep').onclick=()=>{closeModal();setSpeed(1,true);advise('クエストの目標は達成済み。ここからは自由に街づくりを続けられます。')};$('#qList').onclick=()=>{closeModal();modeSel='quest';showTitle()}});sfx('fanfare');return}
  if(qLeft()<=0){S.qDone=1;setSpeed(0,true);showModal(`<h3>期限切れ…「${q.name}」</h3><p>目標：${q.goal}</p><p style="color:var(--sub)">もう一度挑戦してみましょう。</p><div class="btns"><button class="bt" id="qList">クエスト一覧</button><button class="bt gold" id="qAgain">もう一度</button></div>`,null,()=>{$('#qAgain').onclick=()=>{closeModal();startQuest(q)};$('#qList').onclick=()=>{closeModal();modeSel='quest';showTitle()}});sfx('err')}}
$('#questPill').onclick=()=>{const q=QUESTS.find(x=>x.id===S.quest);if(!q)return;const[c,t,dir]=q.prog();
  showModal(`<h3>${q.name}</h3><p style="font-size:15px">目標：${q.goal}</p><table class="tbl"><tr><td>いま</td><td>${fmt(c)}${dir?'（目標 '+fmt(t)+' 以下）':' / '+fmt(t)}</td></tr><tr><td>のこり</td><td>${qLeft()/12|0}年${qLeft()%12}か月</td></tr><tr><td>図鑑</td><td>${Object.keys(S.found).length}/${COMBOS.length}</td></tr></table>${q.tip?`<p style="color:var(--sub);font-size:12px">ヒント：${q.tip}</p>`:''}
   <div class="btns"><button class="bt" id="qBook">図鑑を見る</button><button class="bt gold" data-close>閉じる</button></div>`,null,()=>{$('#qBook').onclick=()=>{closeModal();setTimeout(()=>$('#bookPill').onclick(),150)}})};
function clearLand(x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y))S.terr[y*W+x]=0}
function lay(bit,pts){for(const[x,y]of pts)if(inb(x,y)){S.net[y*W+x]|=bit;S.terr[y*W+x]=0}}
function zoneAt(t,x,y,l){const b=addBuilding(t,x,y);b.lvl=l;b.cls=1;return b}
const PREBUILT={
 jam(){clearLand(22,30,72,50);const row=[];for(let x=22;x<=72;x++)row.push([x,40]);lay(ROAD,row);
   let k=0;for(let x=26;x+3<=70;x+=3){zoneAt('R',x,37,4);zoneAt(k%3===2?'I':'C',x,41,k%3===2?4:4);k++}
   addBuilding('coal',22,36);addBuilding('coal',22,41)},
 crime(){clearLand(24,22,70,54);const X0=26,Y0=24;for(let y=Y0;y<=Y0+28;y+=7){const p=[];for(let x=X0;x<=X0+42;x++)p.push([x,y]);lay(ROAD,p);lay(PWR,p)}const pv=[];for(let y=Y0;y<=Y0+28;y++)pv.push([X0,y]);lay(PWR,pv);for(let x=X0;x<=X0+42;x+=7){const p=[];for(let y=Y0;y<=Y0+28;y++)p.push([x,y]);lay(ROAD,p)}
   const ty=['R','C','R','I','R','C'];let k=0;for(let y=Y0+1;y+3<=Y0+28;y+=7)for(let x=X0+1;x+3<=X0+42;x+=7)for(const[dx,dy]of[[0,0],[3,0],[0,3],[3,3]]){const t=ty[k++%6];zoneAt(t,x+dx,y+dy,3)}
   addBuilding('coal',20,30);const pl=[];for(let x=24;x<=X0+42;x++)pl.push([x,31]);lay(PWR,pl)},
};
function startQuest(q){const st=newState(q.seed,1,q.name);st.quest=q.id;st.funds=q.funds;st.qEnd=(st.year+q.years)*12+st.month;st.rank=q.rank||1;st.xp=xpFor(st.rank);st.perks=[];st.rule=q.rule||{};st.disasters=!!(q.rule&&q.rule.disaster);st.qStart=st.year*12+st.month;
  if(q.pre){S=st;PREBUILT[q.pre]()}startGame(st,true);S.qStartPop=null;if(q.pre){let c=0;for(let k=0;k<CLASSES.length;k++)if(S.pop>=CLASSES[k][0])c=k;S.cls=c;for(const[k,cond]of GIFTS)if(cond())S.giftGiven[k]=1;updHUD()}}
let checkQuestSoon=0;
let modeSel='free';
function buildModes(){const el=$('#modeSel');el.innerHTML=`<button data-m="free" class="${modeSel==='free'?'on':''}">フリー<small>じっくり街づくり</small></button><button data-m="quest" class="${modeSel==='quest'?'on':''}">クエスト<small>${QUESTS.length}のステージに挑戦</small></button>`;
  el.querySelectorAll('button').forEach(x=>x.onclick=()=>{modeSel=x.dataset.m;buildModes()});const free=modeSel==='free';$('#freeOpts').hidden=!free;$('#questList').hidden=free;if(!free)buildQuestList()}
function buildQuestList(){const pr=qProg();const el=$('#questList');el.innerHTML=QUESTS.map((q,i)=>{const open=i===0||pr[QUESTS[i-1].id];const st=(pr[q.id]||{}).stars||0;
  return`<button class="qi${open?'':' lock'}" data-q="${q.id}"><span class="no num">${i+1}</span><span class="tx"><b>${q.name}</b><small>${open?q.goal+`（${q.years}年）`:'前のクエストをクリアすると挑戦できます'}</small></span><span class="st">${st?starStr(st):''}</span></button>`}).join('');
  el.querySelectorAll('.qi').forEach(b=>b.onclick=()=>{if(b.classList.contains('lock')){sfx('err');return}audioInit();startQuest(QUESTS.find(q=>q.id===b.dataset.q))})}
/* ================= boot / title ================= */
let titleOn=true,diffSel=0,titleSeed=(Math.random()*1e9)|0;
function initWorld(state){S=state;
  if(!base){[base,bg]=mk(W*T,H*T)}dirtyAll=true;netChanged=true;
  for(const id in S.bld){S.bld[id].pw=false}
  S.reqs=S.reqs||[];S.found=S.found||{};S.thanks=S.thanks||0;if(S.rank==null){S.rank=S.pop>0?6:1;S.xp=xpFor(S.rank);S.perks=[]}S.perks=S.perks||[];S.rule=S.rule||{};comboBoot=true;
  quickRecalc();recalcTraffic();recalcMaps();demand();comboBoot=false;
}
function showTitle(){buildModes();titleOn=true;$('#title').hidden=false;['#hud','#side','#dock'].forEach(s=>$(s).hidden=true);$('#adv').classList.remove('show');$('#undo').hidden=true;$('#undo1').hidden=true;$('#pad').hidden=true;$('#info').hidden=true;
  const sv=loadSaved();$('#contWrap').innerHTML=sv?`<button class="bt gold" id="contBtn" style="width:100%;margin-bottom:8px">つづきから（${sv.name} ${sv.year}年）</button>`:'';
  if(sv)$('#contBtn').onclick=()=>{audioInit();startGame(sv)};
  initWorld(newState(titleSeed,diffSel,'preview'));cam.z=Math.max(1,Math.min(VW/(W*T),VH/(H*T))*1.6);focusOn([W/2,H/2]);drawLogo();
}
$('#diffSel').querySelectorAll('button').forEach(b=>b.onclick=()=>{diffSel=+b.dataset.d;$('#diffSel').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
$('#reroll').onclick=()=>{titleSeed=(Math.random()*1e9)|0;initWorld(newState(titleSeed,diffSel,'preview'))};
$('#startBtn').onclick=()=>{audioInit();const nm=($('#nameIn').value||'').trim()||'ハコニワ市';startGame(newState(titleSeed,diffSel,nm),true)};
function startGame(state,fresh){initWorld(state);titleOn=false;$('#title').hidden=true;['#hud','#side','#dock'].forEach(s=>$(s).hidden=false);
  undoStack=[];refreshUndo();overlay='none';buildCats();curCat='view';setTool('inspect');$('#trayWin').hidden=true;setSpeed(S.speed!=null?S.speed||1:1,true);
  cam.z=VW<600?2:2.5;focusOn(S.center&&S.zones?S.center:[W/2,H/2]);updHUD();resize();
  if(fresh){advise(`${S.name}の市長就任、おめでとうございます！ ひしょのポッポです。`);const q=S.quest&&QUESTS.find(x=>x.id===S.quest);if(q){advise(`クエスト「${q.name}」：${q.goal}。期限は${q.years}年です。`);if(q.tip)advise(q.tip)}else{advise('まず「電力」から発電所を建てましょう。安い石炭か、きれいな原子力か…');setTimeout(help,300)}}
  else advise('おかえりなさい、市長。');
}

/* ================= main loop ================= */
let last=performance.now(),monthAcc=0,fastAcc=0,hudAcc=0;
const MONTH=[0,10,5,2],FAST=[0,.55,.4,.2];
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  try{if(S){if(titleOn){cam.x+=dt*6;if(cam.x>W*T-VW/cam.z)cam.x=0}
    else if(!modalOpen&&speed>0){monthAcc+=dt;fastAcc+=dt;if(monthAcc>=MONTH[speed]){monthAcc=0;monthTick()}if(fastAcc>=FAST[speed]){fastAcc=0;fireTick()}}
    if(camAnim){const k=Math.min(1,dt*14);cam.x+=(camAnim.x-cam.x)*k;cam.y+=(camAnim.y-cam.y)*k;clampCam();if(Math.abs(camAnim.x-cam.x)+Math.abs(camAnim.y-cam.y)<.3)camAnim=null}
    if(!titleOn)refreshBuild(false);render(dt);drawReticle();drawScreenFx(dt);hudAcc+=dt;if(hudAcc>.25&&!titleOn){hudAcc=0;updHUD()}advTick(dt)}}catch(err){console.error(err)}
  requestAnimationFrame(loop)}
function start(data){
  buildTileArt();buildFx();buildReqIcons();
  window.addEventListener('resize',resize);resize();
  S=newState(1,0,'x');setupIcons();drawAdvisor();
  if(data&&data.save){try{startGame(deserialize(data.save))}catch(e){showTitle()}}else showTitle();
  requestAnimationFrame(loop);
  try{window.claude?.hot?.snapshot?.(()=>({save:S&&!titleOn?serialize():null}))}catch(e){}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(titleOn)drawLogo()});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
