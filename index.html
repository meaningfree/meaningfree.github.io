<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meaningfree</title>
<meta name="description" content="つくったものの置き場。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2714%27%20fill=%27%232C4B8C%27/%3E%3Crect%20x=%278%27%20y=%2726%27%20width=%2712%27%20height=%2712%27%20rx=%272%27%20fill=%27%23fff%27/%3E%3Crect%20x=%2726%27%20y=%2726%27%20width=%2712%27%20height=%2712%27%20rx=%272%27%20fill=%27%23E0A52F%27/%3E%3Crect%20x=%2744%27%20y=%2726%27%20width=%2712%27%20height=%2712%27%20rx=%272%27%20fill=%27%23fff%27%20opacity=%27.45%27/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EDEFF4; --panel:#FFFFFF; --panel-2:#F5F7FB;
    --ink:#151821; --ink-soft:#5C6478; --line:#D3D8E3;
    --accent:#2C4B8C; --gold:#E0A52F;
    --shadow:0 8px 28px rgba(21,24,33,.16);
    --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101218; --panel:#191D26; --panel-2:#141821;
      --ink:#E7EAF2; --ink-soft:#98A1B6; --line:#2B313E;
      --accent:#7EA6EC; --gold:#D6A03A;
      --shadow:0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101218; --panel:#191D26; --panel-2:#141821;
    --ink:#E7EAF2; --ink-soft:#98A1B6; --line:#2B313E;
    --accent:#7EA6EC; --gold:#D6A03A;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); line-height:1.7;
    padding:calc(40px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:center;
  }
  .page{width:100%; max-width:560px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  header{margin-bottom:28px}
  h1{
    font-family:var(--serif); font-weight:700;
    font-size:clamp(22px,6vw,28px); letter-spacing:.04em;
    margin:0 0 6px;
  }
  .lead{margin:0; color:var(--ink-soft); font-size:14px}

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}

  .card{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--accent);
  }
  @media (prefers-reduced-motion: reduce){ .card{transition:none} .card:hover{transform:none} }

  .card h2{
    font-family:var(--serif); font-size:18px; font-weight:700;
    letter-spacing:.03em; margin:0 0 4px;
  }
  .card p{margin:0; font-size:13.5px; color:var(--ink-soft)}

  .tiles{display:flex; gap:4px; margin-bottom:12px}
  .tiles i{width:16px; height:16px; border-radius:3px; background:var(--line)}
  .tiles i:nth-child(1){background:var(--accent)}
  .tiles i:nth-child(3){background:var(--gold)}

  .sticks{display:block; width:72px; height:24px; margin-bottom:10px}

  footer{margin-top:36px; font-size:12.5px; color:var(--ink-soft)}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>meaningfree</h1>
    <p class="lead">つくったものの置き場。</p>
  </header>

  <ul>
    <li>
      <a class="card" href="wordle/">
        <span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <h2>むげんワードル</h2>
        <p>5もじのことばを6かいで当てる。かなと英語、どちらも何回でも遊べます。</p>
      </a>
    </li>
    <li>
      <a class="card" href="matchstick/">
        <svg class="sticks" viewBox="0 0 72 24" aria-hidden="true"><g fill="#F3C97F" stroke="#C08A42" stroke-width=".8"><rect x="2" y="9.5" width="20" height="5" rx="2.5"/><rect x="34" y="1" width="5" height="22" rx="2.5"/><rect x="25.5" y="9.5" width="22" height="5" rx="2.5"/><rect x="52" y="5" width="18" height="5" rx="2.5"/><rect x="52" y="14" width="18" height="5" rx="2.5"/></g><g fill="#E0402E"><circle cx="5" cy="12" r="3.2"/><circle cx="36.5" cy="4" r="3.2"/><circle cx="28.5" cy="12" r="3.2"/><circle cx="55" cy="7.5" r="3.2"/><circle cx="55" cy="16.5" r="3.2"/></g></svg>
        <h2>マッチぼうパズル</h2>
        <p>マッチぼうを うごかしたり、たしたり、とったりして、しきを ただしく しよう。全28問。</p>
      </a>
    </li>
    <li>
      <a class="card" href="sukima/">
        <svg class="sticks" viewBox="0 0 72 24" aria-hidden="true"><g stroke="#7A4A1E" stroke-width=".8"><rect x="1" y="12" width="11" height="11" fill="#D9A766"/><rect x="12" y="12" width="11" height="11" fill="#D9A766"/><rect x="34" y="12" width="11" height="11" fill="#D9A766"/><rect x="45" y="12" width="11" height="11" fill="#D9A766"/><rect x="56" y="12" width="11" height="11" fill="#D9A766"/><rect x="23" y="1" width="11" height="11" fill="#F2B33D"/><rect x="23" y="12" width="11" height="11" fill="#F2B33D"/></g></svg>
        <h2>すきまブロック</h2>
        <p>下からせり上がる木の壁のすきまに、ピースをはめて消していく。上までつみあがったらおしまい。</p>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/meaningfree/meaningfree.github.io">ソース</a>
  </footer>

</div>
</body>
</html>
